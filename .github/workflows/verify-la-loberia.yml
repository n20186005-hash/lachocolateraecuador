name: La Chocolatera live browser acceptance
on:
  push:
    branches: [verify-148-desktop-mobile]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright==1.56.0
      - run: python .github/verify-la-loberia.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: la-chocolatera-home-la-loberia-evidence
          path: visual-evidence
          retention-days: 30
